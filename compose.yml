#[root@Manager myproject]# cat compose.yml
---
services:
  db:
    image: kee26/myproject:db
    ports:
      - "3306:3306"
    deploy:
      replicas: 1
  auth_service:
    image: kee26/myproject:auth
    ports:
      - "5001:5001"
    deploy:
      replicas: 1
    depends_on:
      - db
  book_service:
    image: kee26/myproject:book
    ports:
      - "5002:5002"
    deploy:
      replicas: 1
    depends_on:
      - db
  borrow_service:
    image: kee26/myproject:borrow
    ports:
      - "5003:5003"
    deploy:
      replicas: 1
    depends_on:
      - db
  app_service:
    image: kee26/myproject:frontend
    ports:
      - "5000:5000"
    deploy:
      replicas: 1
    depends_on:
      - auth_service
      - book_service
      - borrow_service
